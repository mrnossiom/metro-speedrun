[package]
name = "metro-speedrun"
version = "0.0.0"
edition = "2024"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
eyre = "0.6"
petgraph = "0.8"
reqwest = { version = "0.13", features = ["blocking", "query"] }
russcip = "0.9"
serde = { version = "1", features = ["derive"] }
